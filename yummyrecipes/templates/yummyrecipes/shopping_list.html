{% load hitcount_tags %} {% load static %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
      rel="stylesheet"
      href="'https://fonts.googleapis.com/css2?family=Comfortaa:wght@500&display=swap">

    <title>Ingredients list for {{recipe_object.title}}</title>
  </head>

  <style>
    h1 {
      text-align: center;
      font-size: 2em;
      margin-bottom: 0;
      padding-top: 15px;
    }

    h3 {
      font-size: 1.5em;
      margin-bottom: 20px;
    }

    .recipe-data {
      font-size: 1.45em;
    }
  </style>

  <body>
    <h1>{{ recipe_object.title }}</h1>

    <h3>Ingredients required</h3>

    <div class="recipe-data">
      <p>{{recipe_ingredients|safe}}</p>
    </div>
  </body>
</html>
