<table class="dashboard-table table">
    <thead>
        <tr>
            <th>Recipe</th>
            <th>Date</th>
            <th class="text-center">Credits Spent</th>
        </tr>
    </thead>
    <tbody>
        {% for spent in credit_spent_history %}
        <tr>
            <td>
                <a href="{{ spent.recipename.get_absolute_url }}" class="link link-hover">{{ spent.recipename.title }}</a>
            </td>
            <td>{{ spent.spent_timestamp|date:"d M Y" }}</td>
            <td class="text-center font-medium">-{{ spent.amount }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="3" class="text-center py-12 opacity-60">No spent credits yet.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
